name: Feature request
description: Propose a focused AzAdmin component, layout, state, or integration improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or integration problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the semantic HTML, CSS, state, and accessibility model.
    validations:
      required: true
  - type: dropdown
    id: javascript
    attributes:
      label: JavaScript classification
      options:
        - No JavaScript required
        - Minimal optional JavaScript
        - JavaScript required
        - Not determined
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Native alternatives considered
      description: Explain whether details/summary, Grid, :target, scroll snap, or another native pattern can solve it.
  - type: checkboxes
    id: requirements
    attributes:
      label: Project requirements
      options:
        - label: The proposal supports one markup structure for LTR and RTL.
          required: true
        - label: The proposal follows the fixed mobile-first breakpoint system.
          required: true
        - label: The proposal can be implemented from scratch without copying another panel.
          required: true
