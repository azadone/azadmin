name: Bug report
description: Report a reproducible problem in AzAdmin.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a reproducible AzAdmin problem.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible HTML/CSS/JS example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, direction, theme, and viewport layer.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I reproduced the problem with the current repository state.
          required: true
        - label: This is not a public security vulnerability report.
          required: true
